<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Course Allocation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <header>
            <h1>Register</h1>
            <p>Create your student or admin account</p>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="card">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div style="margin-bottom: 1rem;">
                    <label for="username" style="display: block; margin-bottom: 0.5rem;">Unique Student Data ID (Login
                        Username)</label>
                    <input type="text" id="username" name="username" required placeholder="e.g. PRN123456"
                        pattern="^[a-zA-Z0-9]+$" title="Alphanumeric characters only (no spaces)"
                        style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #ddd;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="full_name" style="display: block; margin-bottom: 0.5rem;">Student Name</label>
                    <input type="text" id="full_name" name="full_name" required placeholder="Full Name"
                        pattern="[a-zA-Z\s]+" title="Name should only contain letters and spaces"
                        style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #ddd;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="email" style="display: block; margin-bottom: 0.5rem;">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="student@example.com"
                        style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #ddd;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div style="margin-bottom: 1rem;">
                        <label for="student_class" style="display: block; margin-bottom: 0.5rem;">Class</label>
                        <input type="text" id="student_class" name="student_class" required placeholder="e.g. TY-B"
                            style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #ddd;">
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label for="roll_no" style="display: block; margin-bottom: 0.5rem;">Roll No.</label>
                        <input type="text" id="roll_no" name="roll_no" required placeholder="e.g. 45"
                            pattern="^[a-zA-Z0-9]+$" title="Alphanumeric roll number"
                            style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #ddd;">
                    </div>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="mobile" style="display: block; margin-bottom: 0.5rem;">Mobile No.</label>
                    <input type="tel" id="mobile" name="mobile" required placeholder="10-digit Mobile No."
                        pattern="^\d{10}$" title="Please enter a valid 10-digit mobile number"
                        style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #ddd;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="department" style="display: block; margin-bottom: 0.5rem;">Engineering
                        Department</label>
                    <select id="department" name="department" required
                        style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #ddd;">
                        <option value="" disabled selected>Select Department</option>
                        <option value="Agricultural Engineering">Agricultural Engineering</option>
                        <option value="Computer Science Engineering">Computer Science Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Computer Science Design">Computer Science Design</option>
                        <option value="Electronics and Computer Engineering">Electronics and Computer Engineering
                        </option>
                        <option value="AIDS">AIDS</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                        <option value="Mechatronics Engineering">Mechatronics Engineering</option>
                        <option value="Plastics and Polymer engineering">Plastics and Polymer engineering</option>
                        <option value="Electronics and Telecommunication Engineering">Electronics and Telecommunication
                            Engineering</option>
                    </select>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="password" style="display: block; margin-bottom: 0.5rem;">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password"
                        style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #ddd;">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Create Account</button>
            </form>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                Already have an account? <a href="{{ url_for('login') }}">Login here</a>
            </p>
        </div>
    </div>
</body>

</html>
