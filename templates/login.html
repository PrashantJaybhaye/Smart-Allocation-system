<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Course Allocation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>
    <div class="container" style="max-width: 400px; margin-top: 6rem;">
        <header class="text-center mb-4">
            <h1>Login</h1>
            <p class="subtitle">Access your allocation dashboard</p>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="card">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="username">Username / Student ID</label>
                    <input type="text" id="username" name="username" required class="form-control"
                        placeholder="Enter your ID">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="form-control" placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-block">Sign In</button>
            </form>
            <p class="text-center mt-4" style="font-size: 0.9rem;">
                Don't have an account? <a href="{{ url_for('register') }}"
                    style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
            </p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
