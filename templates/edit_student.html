<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>
    <div class="container" style="max-width: 600px; margin-top: 4rem;">
        <header class="text-center mb-4">
            <h1>Edit Student</h1>
            <p class="subtitle">Update student details</p>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="card">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="username">Unique Student Data ID (Login Username)</label>
                    <input type="text" id="username" name="username" value="{{ student.student_id }}" readonly
                        class="form-control" style="background-color: #f3f4f6; cursor: not-allowed;">
                    <small style="color: var(--text-muted);">Username cannot be changed.</small>
                </div>

                <div class="form-group">
                    <label for="full_name">Student Name</label>
                    <input type="text" id="full_name" name="full_name" value="{{ student.name }}" required
                        class="form-control" pattern="^[\p{L}\s\.\-\']+$"
                        title="Name should contain letters, spaces, hyphens, periods, or apostrophes">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" value="{{ student.email }}" required
                        class="form-control">
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="student_class">Class</label>
                        <input type="text" id="student_class" name="student_class" value="{{ student.student_class }}"
                            required class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="roll_no">Roll No.</label>
                        <input type="text" id="roll_no" name="roll_no" value="{{ student.roll_no }}" required
                            class="form-control" pattern="^[a-zA-Z0-9]+$" title="Alphanumeric roll number">
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile No.</label>
                    <input type="tel" id="mobile" name="mobile" value="{{ student.mobile_no }}" required
                        class="form-control" pattern="^\d{10}$" title="Please enter a valid 10-digit mobile number">
                </div>

                <div class="form-group">
                    <label for="department">Engineering Department</label>
                    <select id="department" name="department" required class="form-control">
                        <option value="" disabled>Select Department</option>
                        {% set departments = [
                        "Agricultural Engineering", "Computer Science Engineering", "Civil Engineering",
                        "Computer Science Design", "Electronics and Computer Engineering", "AIDS",
                        "Mechanical Engineering", "Electrical Engineering", "Mechatronics Engineering",
                        "Plastics and Polymer engineering", "Electronics and Telecommunication Engineering"
                        ] %}
                        {% for dept in departments %}
                        <option value="{{ dept }}" {% if student.department==dept %}selected{% endif %}>{{ dept }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid-2" style="margin-top: 1rem;">
                    <a href="{{ url_for('admin_students_list') }}" class="btn btn-secondary"
                        style="text-align: center;">Cancel</a>
                    <button type="submit" class="btn">Update Student</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
